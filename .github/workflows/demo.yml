name: Run bot (10-minute live session)
on:
  workflow_dispatch:
  push:
    branches: [main, php-live-test]
    paths: ['.demo-request', 'bot.php']
permissions:
  contents: write
concurrency:
  group: order-bot-demo
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'php-live-test' || contains(github.event.head_commit.modified, '.demo-request')
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      SUPPORT_CONTACT: ${{ secrets.SUPPORT_CONTACT || secrets.SUPPORT || vars.SUPPORT_CONTACT || vars.SUPPORT || '' }}
      MEMBER_PACKAGE_PRICE_STARS: ${{ vars.MEMBER_PACKAGE_PRICE_STARS || '385' }}
      RUN_SECONDS: '600'
      DB_PATH: /tmp/crowdio-live/orders.sqlite3
      STATE_REPOSITORY: ${{ github.repository }}
      STATE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, pdo_sqlite, openssl
      - name: Validate secrets
        run: |
          test -n "$BOT_TOKEN" || { echo 'Add BOT_TOKEN Actions secret.'; exit 1; }
          test -n "$ADMIN_ID" || { echo 'Add ADMIN_ID Actions secret.'; exit 1; }
      - run: php bot.php
