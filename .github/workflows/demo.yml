name: Run bot (10-minute live session)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.demo-request']
permissions:
  contents: write
concurrency:
  group: order-bot-demo
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      ADMIN_ID: ${{ secrets.ADMIN_ID }}
      SUPPORT_CONTACT: ${{ secrets.SUPPORT_CONTACT || secrets.SUPPORT || vars.SUPPORT_CONTACT || vars.SUPPORT || '' }}
      DEMO_MODE: '0'
      RUN_SECONDS: '600'
      DB_PATH: /tmp/crowdio-live/orders.sqlite3
      STATE_REPOSITORY: ${{ github.repository }}
      STATE_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Validate secrets
        run: |
          test -n "$BOT_TOKEN" || { echo 'Add BOT_TOKEN Actions secret.'; exit 1; }
          test -n "$ADMIN_ID" || { echo 'Add ADMIN_ID Actions secret.'; exit 1; }
      - run: python -u bot.py
